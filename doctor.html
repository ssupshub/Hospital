<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - LifeCare Hospital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="displayDoctors()">

<header class="navbar">
    <div class="logo"><div class="logo-icon">LC</div> LifeCare</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="patient.html">Patients</a>
        <a href="doctor.html" class="active">Doctors</a>
        <a href="appointment.html">Appointments</a>
        <a href="billing.html">Billing</a>
        <button onclick="logout()" class="btn-ghost btn-sm">Logout</button>
    </nav>
</header>

<div class="page-wrapper">
    <div class="page-header">
        <h1>Doctor Management</h1>
        <p>Add, edit, and manage doctor profiles</p>
    </div>

    <div class="mgmt-layout">
        <div class="form-panel">
            <h3>Add / Update Doctor</h3>
            <input type="text" id="dname" placeholder="Doctor Name">
            <input type="text" id="dspecial" placeholder="Specialization">
            <input type="number" id="dexp" placeholder="Experience (years)">
            <button onclick="saveDoctor()">Save Doctor</button>
        </div>

        <div class="data-panel">
            <div class="panel-header">
                <h3>Doctor Records</h3>
                <input type="text" class="search-input" id="searchDoctor" placeholder="Search doctors..." oninput="searchDoctor()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Specialization</th>
                        <th>Experience</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="doctorTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
