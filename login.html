<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LifeCare Hospital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="login-wrapper">
    <section class="login-left">
        <div class="branding">
            <h1>Hospital<br>Management<br>System</h1>
            <p>Secure and smart healthcare solution. Manage patients, doctors, appointments, and billing from a single platform.</p>
        </div>
    </section>

    <section class="login-right">
        <form class="login-form" id="loginForm" novalidate>
            <h2>Welcome back</h2>
            <p class="login-subtitle">Enter your credentials to access the dashboard</p>

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="input-group password-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                <span class="toggle-password" id="togglePassword">Show</span>
            </div>

            <div class="form-options">
                <label><input type="checkbox" name="remember"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn btn-primary">Sign In</button>

            <p class="register-text">
                Don't have an account? <a href="#">Contact Admin</a>
            </p>
        </form>
    </section>
</main>

<script src="js/script.js"></script>
</body>
</html>
